<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Result Checker</title>
    <!-- Using a sleek font and generic styles -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .checker-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .checker-card h2 {
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .btn-check-result {
            background-color: #5c6bc0;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-check-result:hover {
            background-color: #3f51b5;
        }
        #resultMessage {
            margin-top: 20px;
            font-weight: 600;
            font-size: 18px;
            display: none;
            padding: 15px;
            border-radius: 10px;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .failure { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="checker-card">
        <h2>Result Checker</h2>
        <p class="text-muted mb-4">Select your exam and enter your details</p>

        <form id="checkerForm">
            <select id="examSelect" class="form-select" required>
                <option value="" disabled selected>Loading exams...</option>
            </select>
            
            <input type="text" id="rollNumber" class="form-control" placeholder="Enter Roll Number" required>
            <input type="text" id="studentName" class="form-control" placeholder="Enter Student Name" required>
            <input type="tel" id="mobileNumber" class="form-control" placeholder="Enter 10-Digit Mobile Number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
            
            <button type="submit" class="btn-check-result" id="submitBtn">Check Result</button>
        </form>

        <div id="resultMessage"></div>
    </div>

    <!-- JS for logic and confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const examSelect = document.getElementById('examSelect');
            
            // Fetch exams
            try {
                const response = await fetch('/api/exams');
                const exams = await response.json();
                
                examSelect.innerHTML = '';
                if(exams.length === 0) {
                    examSelect.innerHTML = '<option value="" disabled selected>No exams available currently</option>';
                    document.getElementById('submitBtn').disabled = true;
                } else {
                    exams.forEach(exam => {
                        const option = document.createElement('option');
                        option.value = exam.id;
                        option.textContent = `${exam.exam_name} - ${exam.tier}`;
                        if (exam.is_default) {
                            option.selected = true;
                        }
                        examSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error("Failed to load exams", error);
                examSelect.innerHTML = '<option value="" disabled selected>Error loading exams</option>';
            }
        });

        document.getElementById('checkerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const examId = document.getElementById('examSelect').value;
            const rollNumber = document.getElementById('rollNumber').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const resultMessage = document.getElementById('resultMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (!examId || !rollNumber || !studentName || !mobileNumber) return;

            submitBtn.textContent = "Checking...";
            submitBtn.disabled = true;
            resultMessage.style.display = 'none';
            resultMessage.className = '';

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        exam_id: examId, 
                        roll_number: rollNumber,
                        name: studentName,
                        mobile: mobileNumber
                    })
                });

                const data = await response.json();

                resultMessage.style.display = 'block';
                if (data.found) {
                    resultMessage.textContent = "🎉 Congratulations! You have Qualified.";
                    resultMessage.className = 'success';
                    fireConfetti();
                } else {
                    resultMessage.textContent = "Not Qualified / Not Found. Better luck next time.";
                    resultMessage.className = 'failure';
                }
            } catch (error) {
                console.error("Check failed", error);
                resultMessage.style.display = 'block';
                resultMessage.textContent = "An error occurred while checking. Please try again.";
                resultMessage.className = 'failure';
            } finally {
                submitBtn.textContent = "Check Result";
                submitBtn.disabled = false;
            }
        });

        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
